version: '3.9'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: nativecolab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nativecolab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nativecolab123}
      POSTGRES_DB: ${POSTGRES_DB:-nativecolab}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nativecolab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nativecolab-network

  # ============================================
  # Redis Cache & Message Broker
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: nativecolab-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >-
      sh -ec 'if [ -n "$${REDIS_PASSWORD}" ]; then
      exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
      else exec redis-server --appendonly yes; fi'
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nativecolab-network

  # ============================================
  # RustFS Object Storage (S3-compatible)
  # ============================================
  minio:
    image: rustfs/rustfs:latest
    container_name: nativecolab-minio
    restart: unless-stopped
    depends_on:
      minio-volume-permission:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      RUSTFS_OBS_LOGGER_LEVEL: info
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    networks:
      - nativecolab-network

  # ============================================
  # RustFS volume permissions for its non-root runtime user
  # ============================================
  minio-volume-permission:
    image: alpine:3.20
    container_name: nativecolab-minio-volume-permission
    restart: "no"
    command: ["sh", "-ec", "chown -R 10001:10001 /data"]
    volumes:
      - minio-data:/data
    networks:
      - nativecolab-network

  # ============================================
  # AWS CLI (for initial bucket creation)
  # ============================================
  minio-client:
    image: amazon/aws-cli:latest
    container_name: nativecolab-minio-client
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin123}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      BUCKET="${S3_BUCKET:-nativecolab}";
      ENDPOINT="http://minio:9000";
      if ! aws s3api head-bucket --bucket "$${BUCKET}" --endpoint-url "$${ENDPOINT}" 2>/dev/null; then
        aws s3api create-bucket --bucket "$${BUCKET}" --endpoint-url "$${ENDPOINT}";
      fi;
      printf '{"Version":"2012-10-17","Statement":[{"Sid":"PublicReadGetObject","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::%s/*"}]}' "$${BUCKET}" > /tmp/policy.json;
      aws s3api put-bucket-policy --bucket "$${BUCKET}" --policy file:///tmp/policy.json --endpoint-url "$${ENDPOINT}";
    networks:
      - nativecolab-network

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nativecolab-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nativecolab}:${POSTGRES_PASSWORD:-nativecolab123}@postgres:5432/${POSTGRES_DB:-nativecolab}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./backend:/app
      - backend-uploads:/app/uploads
    ports:
      - "${NATIVE_COLAB_BACKEND_HOST_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nativecolab-network

  # ============================================
  # Celery Worker (Background Tasks)
  # ============================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nativecolab-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nativecolab}:${POSTGRES_PASSWORD:-nativecolab123}@postgres:5432/${POSTGRES_DB:-nativecolab}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - nativecolab-network

  # ============================================
  # Celery Beat (Scheduled Tasks)
  # ============================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nativecolab-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nativecolab}:${POSTGRES_PASSWORD:-nativecolab123}@postgres:5432/${POSTGRES_DB:-nativecolab}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - nativecolab-network

  # ============================================
  # React + Vite Frontend
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nativecolab-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${NATIVE_COLAB_BACKEND_HOST_PORT:-8001}
      VITE_SOCKET_URL: http://localhost:${NATIVE_COLAB_BACKEND_HOST_PORT:-8001}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - nativecolab-network

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: nativecolab-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - nativecolab-network

# ============================================
# Volumes
# ============================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  backend-uploads:
    driver: local
  nginx-logs:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  nativecolab-network:
    driver: bridge
