# Render Blueprint Specification for TEAM ORBIT
# Documentation: https://render.com/docs/blueprint-spec

databases:
  # ============================================
  # Managed PostgreSQL Database
  # ============================================
  - name: team-orbit-db
    databaseName: teamorbit
    user: teamorbit
    plan: free
    ipAllowList: [] # Allow all internal connections

services:
  # ============================================
  # FastAPI Core API & WebSocket Service
  # ============================================
  - type: web
    name: team-orbit-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    rootDir: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: team-orbit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_NAME
        value: "TEAM ORBIT"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "info"
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

  # ============================================
  # React + Vite Frontend (Static Site / Global CDN)
  # ============================================
  - type: web
    name: team-orbit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_URL
        fromService:
          type: web
          name: team-orbit-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: team-orbit-backend
          property: host
